<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project in development — Future Vector LLC</title>
<meta name="description" content="A new project by Future Vector LLC is in development.">
<meta name="robots" content="noindex">
<style>
  :root{--bg:#0b0d12;--fg:#eef0f4;--muted:#9aa1ad;--ring:#5fd1c1}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:radial-gradient(circle at 50% 40%,#16202c 0%,var(--bg) 60%);color:var(--fg);
       font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
       display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .ring{width:120px;height:120px;margin:0 auto 36px;border-radius:50%;
        border:2px solid var(--ring);box-shadow:0 0 40px rgba(95,209,193,.35),inset 0 0 30px rgba(95,209,193,.2);
        animation:pulse 4s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 60px rgba(95,209,193,.5),inset 0 0 40px rgba(95,209,193,.3)}}
  h1{font-size:2.2rem;font-weight:600;letter-spacing:-.01em;margin:0 0 8px}
  .ru{color:var(--muted);font-size:1.15rem;margin:0 0 40px}
  footer{color:var(--muted);font-size:.95rem}
  a{color:var(--ring);text-decoration:none}
  a:hover{text-decoration:underline}
</style>
</head>
<body>
<main>
  <div class="ring" aria-hidden="true"></div>
  <h1>Project in development</h1>
  <p class="ru">Проект в разработке</p>
  <footer>
    Future Vector LLC<br>
    <a href="mailto:ivan@frescoagent.com">ivan@frescoagent.com</a>
  </footer>
</main>
</body>
</html>
